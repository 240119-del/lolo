<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Monitor Pro</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0d0e12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .layout { flex-direction: column; }
        }
        .sidebar, .main-content {
            background: #12131a;
            border: 1px solid #1f222e;
            padding: 25px;
            border-radius: 16px;
        }
        .sidebar { flex: 1; min-width: 280px; }
        .main-content { flex: 2; }
        
        .status-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            background: #12131a;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #1f222e;
            box-sizing: border-box;
        }
        .online-count { color: #10b981; }
        .study-timer { color: #8b5cf6; }

        /* Поля ввода */
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1f222e;
            border: 1px solid #2d3142;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        .btn {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-status { background: #2d3142; border: 1px solid #3f445e; }
        .btn-status.active { border-color: #8b5cf6; background: #8b5cf6/20; }
        
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* Таблица Лидерборда */
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1f222e;
        }
        .leaderboard-item:last-child { border: none; }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-online { background: #10b981; }
        .status-break { background: #f59e0b; }
        .status-busy { background: #ef4444; }
        .status-offline { background: #6b7280; }
    </style>
</head>
<body>

<div class="status-bar">
    <span class="online-count">● В сети: <span id="onlineNum">0</span></span>
    <span class="study-timer">Таймер сессии: <span id="timerVal">0</span> сек.</span>
</div>

<div class="layout">
    <div class="sidebar">
        <h3 style="margin-top: 0; color: #a78bfa;">ТОП СТУДЕНТОВ</h3>
        <div id="leaderboard">Загрузка рейтинга...</div>
    </div>

    <div class="main-content">
        <div id="authForm">
            <h3 style="margin-top:0;">Вход / Регистрация</h3>
            <input type="email" id="authEmail" placeholder="Твой Email">
            <input type="password" id="authPassword" placeholder="Пароль">
            <button id="loginBtn" class="btn">Войти</button>
            <button id="registerBtn" class="btn" style="background: #2d3142;">Создать аккаунт</button>
        </div>
        
        <div id="controls" style="display: none;">
            <p id="welcomeMsg" style="font-size: 18px; font-weight: bold; margin-top:0;"></p>
            
            <div class="status-grid">
                <button id="statusOnline" class="btn btn-status">В сети</button>
                <button id="statusBreak" class="btn btn-status">Отошёл</button>
                <button id="statusBusy" class="btn btn-status">Занят</button>
                <button id="statusOffline" class="btn btn-status">Не беспокоить</button>
            </div>

            <button id="logoutBtn" class="btn" style="background: #ef4444/20; color: #ef4444;">Выйти из профиля</button>
        </div>
    </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// СЮДА ТЫ ВСТАВЛЯЕШЬ СВОИ ДАННЫЕ ИЗ SUPABASE (Settings -> API)
const SUPABASE_URL = "https://igkztilwhrzpussrrfel.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlna3p0aWx3aHJ6cHVzc3JyZmVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NTUxNTcsImV4cCI6MjA5MjMzMTE1N30.IsXOhmEni9LlWtTwcMLRDdXAYwZpcjIDh3wc3EQnyJo";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let totalSeconds = 0;
let currentStatus = 'offline';
let currentUser = null;

// --- ТРЕКИНГ ОНЛАЙНА ЧЕРЕЗ PRESENCE ---
async function trackPresence(user) {
    const channel = supabase.channel('online-users');
    channel
        .on('presence', { event: 'sync' }, () => {
            const state = channel.presenceState();
            document.getElementById('onlineNum').innerText = Object.keys(state).length;
        })
        .subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
                await channel.track({ user: user.email, online_at: new Date() });
            }
        });
}

// --- СЕКУНДОМЕР ---
setInterval(async () => {
    if (currentUser && currentStatus === 'online') {
        totalSeconds++;
        document.getElementById('timerVal').innerText = totalSeconds;
        
        if (totalSeconds % 10 === 0) {
            await supabase.from('profiles').upsert({ 
                id: currentUser.id, 
                full_name: currentUser.email.split('@')[0], // Имя из почты
                total_study_time: totalSeconds,
                current_status: currentStatus
            });
        }
    }
}, 1000);

// --- ИЗМЕНЕНИЕ СТАТУСОВ ---
async function changeStatus(newStatus) {
    currentStatus = newStatus;
    document.querySelectorAll('.btn-status').forEach(b => b.classList.remove('active'));
    
    if(currentUser) {
        await supabase.from('profiles').update({ current_status: newStatus }).eq('id', currentUser.id);
    }
}

document.getElementById('statusOnline').onclick = () => changeStatus('online');
document.getElementById('statusBreak').onclick = () => changeStatus('break');
document.getElementById('statusBusy').onclick = () => changeStatus('busy');
document.getElementById('statusOffline').onclick = () => changeStatus('offline');

// --- ЛИДЕРБОРД ---
async function loadLeaderboard() {
    const { data } = await supabase.from('profiles').select('*').order('total_study_time', { ascending: false });
    if (data) {
        const board = document.getElementById('leaderboard');
        board.innerHTML = "";
        data.forEach(student => {
            let sClass = 'status-offline';
            if (student.current_status === 'online') sClass = 'status-online';
            if (student.current_status === 'break') sClass = 'status-break';
            if (student.current_status === 'busy') sClass = 'status-busy';

            board.innerHTML += `
                <div class="leaderboard-item">
                    <span><span class="status-dot ${sClass}"></span>${student.full_name}</span>
                    <b style="color: #a78bfa;">${student.total_study_time} с</b>
                </div>
            `;
        });
    }
}

// СЛУШАЕМ ИЗМЕНЕНИЯ БАЗЫ В РЕАЛЬНОМ ВРЕМЕНИ
supabase.channel('db-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
    loadLeaderboard();
}).subscribe();

// --- КНОПКИ АВТОРИЗАЦИИ (БЕЗ GOOGLE) ---
document.getElementById('registerBtn').onclick = async () => {
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPassword').value;
    const { error } = await supabase.auth.signUp({ email, password });
    if (error) alert(error.message); else alert("Регистрация успешна! Проверь почту для подтверждения.");
};

document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPassword').value;
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) alert(error.message); else location.reload();
};

document.getElementById('logoutBtn').onclick = async () => {
    await supabase.auth.signOut();
    location.reload();
};

// --- СТАРТ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ ---
window.addEventListener("DOMContentLoaded", async () => {
    loadLeaderboard();
    const { data: { session } } = await supabase.auth.getSession();
    
    if (session) {
        currentUser = session.user;
        document.getElementById('authForm').style.display = 'none';
        document.getElementById('controls').style.display = 'block';
        document.getElementById('welcomeMsg').innerText = `Студент: ${currentUser.email}`;
        
        trackPresence(currentUser);

        const { data } = await supabase.from('profiles').select('total_study_time, current_status').eq('id', currentUser.id).single();
        if (data) {
            totalSeconds = data.total_study_time;
            currentStatus = data.current_status;
            document.getElementById('timerVal').innerText = totalSeconds;
        }
    }
});
</script>
</body>
</html>
