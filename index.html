<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Monitor Pro</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0d0e12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .layout { flex-direction: column; }
        }
        .sidebar, .main-content {
            background: #12131a;
            border: 1px solid #1f222e;
            padding: 25px;
            border-radius: 16px;
        }
        .sidebar { flex: 1; min-width: 280px; }
        .main-content { flex: 2; }
        
        .status-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            background: #12131a;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #1f222e;
            box-sizing: border-box;
        }
        .online-count { color: #10b981; }
        .study-timer { color: #8b5cf6; }

        .btn {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-status { background: #2d3142; border: 1px solid #3f445e; }
        .btn-status.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.2); }
        
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1f222e;
        }
        .leaderboard-item:last-child { border: none; }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-online { background: #10b981; }
        .status-break { background: #f59e0b; }
        .status-busy { background: #ef4444; }
        .status-offline { background: #6b7280; }
        
        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        
        .user-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1f222e;
        }
    </style>
</head>
<body>

<div class="status-bar">
    <span class="online-count">● В сети: <span id="onlineNum">0</span></span>
    <span class="study-timer">Таймер сессии: <span id="timerVal">0</span> сек.</span>
</div>

<div class="layout">
    <div class="sidebar">
        <h3 style="margin-top: 0; color: #a78bfa;">ТОП СТУДЕНТОВ</h3>
        <div id="leaderboard">Загрузка рейтинга...</div>
    </div>

    <div class="main-content">
        <div id="authSection">
            <h3 style="margin-top:0; text-align: center;">Добро пожаловать в Study Monitor Pro</h3>
            <p style="text-align: center; color: #9ca3af; margin-bottom: 25px;">Войдите с помощью Google, чтобы продолжить</p>
            <div class="google-btn-container">
                <div id="googleButton"></div>
            </div>
        </div>
        
        <div id="controls" style="display: none;">
            <div class="user-info">
                <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
                <p id="welcomeMsg" style="font-size: 18px; font-weight: bold; margin: 10px 0 5px 0;"></p>
                <p id="userEmail" style="color: #9ca3af; margin: 0;"></p>
            </div>
            
            <div class="status-grid">
                <button id="statusOnline" class="btn btn-status">В сети</button>
                <button id="statusBreak" class="btn btn-status">Отошёл</button>
                <button id="statusBusy" class="btn btn-status">Занят</button>
                <button id="statusOffline" class="btn btn-status">Не беспокоить</button>
            </div>

            <button id="logoutBtn" class="btn" style="background: rgba(239, 68, 68, 0.2); color: #ef4444;">Выйти из профиля</button>
        </div>
    </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const SUPABASE_URL = "https://igkztilwhrzpussrrfel.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlna3p0aWx3aHJ6cHVzc3JyZmVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NTUxNTcsImV4cCI6MjA5MjMzMTE1N30.IsXOhmEni9LlWtTwcMLRDdXAYwZpcjIDh3wc3EQnyJo";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let totalSeconds = 0;
let currentStatus = 'offline';
let currentUser = null;
let studyInterval = null;

// --- ТРЕКИНГ ОНЛАЙНА ЧЕРЕЗ PRESENCE ---
async function trackPresence(user) {
    const channel = supabase.channel('online-users');
    channel
        .on('presence', { event: 'sync' }, () => {
            const state = channel.presenceState();
            document.getElementById('onlineNum').innerText = Object.keys(state).length;
        })
        .subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
                await channel.track({ user: user.email, online_at: new Date() });
            }
        });
}

// --- СЕКУНДОМЕР (только если статус online) ---
function startStudyTimer() {
    if (studyInterval) clearInterval(studyInterval);
    
    studyInterval = setInterval(async () => {
        if (currentUser && currentStatus === 'online') {
            totalSeconds++;
            document.getElementById('timerVal').innerText = totalSeconds;
            
            // Сохраняем в базу каждые 10 секунд
            if (totalSeconds % 10 === 0) {
                await supabase.from('profiles').upsert({ 
                    id: currentUser.id, 
                    full_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
                    avatar_url: currentUser.user_metadata?.avatar_url || '',
                    total_study_time: totalSeconds,
                    current_status: currentStatus,
                    updated_at: new Date()
                });
            }
        }
    }, 1000);
}

// --- ИЗМЕНЕНИЕ СТАТУСОВ ---
async function changeStatus(newStatus) {
    currentStatus = newStatus;
    document.querySelectorAll('.btn-status').forEach(b => b.classList.remove('active'));
    
    if(currentUser) {
        await supabase.from('profiles').update({ current_status: newStatus }).eq('id', currentUser.id);
        await loadLeaderboard();
    }
}

// --- ЛИДЕРБОРД ---
async function loadLeaderboard() {
    const { data } = await supabase.from('profiles').select('*').order('total_study_time', { ascending: false }).limit(20);
    if (data) {
        const board = document.getElementById('leaderboard');
        board.innerHTML = "";
        data.forEach(student => {
            let sClass = 'status-offline';
            if (student.current_status === 'online') sClass = 'status-online';
            if (student.current_status === 'break') sClass = 'status-break';
            if (student.current_status === 'busy') sClass = 'status-busy';

            board.innerHTML += `
                <div class="leaderboard-item">
                    <span><span class="status-dot ${sClass}"></span>${student.full_name || student.email || 'Студент'}</span>
                    <b style="color: #a78bfa;">${Math.floor(student.total_study_time / 60)} мин ${student.total_study_time % 60} с</b>
                </div>
            `;
        });
    }
}

// --- ЗАГРУЗКА ПРОФИЛЯ ПОЛЬЗОВАТЕЛЯ ---
async function loadUserProfile() {
    if (!currentUser) return;
    
    const { data } = await supabase.from('profiles').select('total_study_time, current_status').eq('id', currentUser.id).single();
    if (data) {
        totalSeconds = data.total_study_time || 0;
        currentStatus = data.current_status || 'offline';
        document.getElementById('timerVal').innerText = totalSeconds;
        
        // Активируем нужную кнопку статуса
        document.querySelectorAll('.btn-status').forEach(btn => btn.classList.remove('active'));
        if (currentStatus === 'online') document.getElementById('statusOnline')?.classList.add('active');
        if (currentStatus === 'break') document.getElementById('statusBreak')?.classList.add('active');
        if (currentStatus === 'busy') document.getElementById('statusBusy')?.classList.add('active');
        if (currentStatus === 'offline') document.getElementById('statusOffline')?.classList.add('active');
    }
}

// --- ВЫХОД ---
async function logout() {
    await supabase.auth.signOut();
    location.reload();
}

// --- ИНИЦИАЛИЗАЦИЯ ПОСЛЕ ВХОДА ---
async function initUserSession(session) {
    currentUser = session.user;
    
    // Показываем controls, скрываем authSection
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('controls').style.display = 'block';
    
    // Заполняем информацию о пользователе
    document.getElementById('welcomeMsg').innerText = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
    document.getElementById('userEmail').innerText = currentUser.email;
    if (currentUser.user_metadata?.avatar_url) {
        document.getElementById('userAvatar').src = currentUser.user_metadata.avatar_url;
    }
    
    await trackPresence(currentUser);
    await loadUserProfile();
    startStudyTimer();
    await loadLeaderboard();
}

// --- НАСТРОЙКА GOOGLE LOGIN ---
function setupGoogleLogin() {
    if (!window.google) {
        setTimeout(setupGoogleLogin, 100);
        return;
    }
    
    window.google.accounts.id.initialize({
        client_id: "1072145910606-1v6n6r6v1v6n6r6v1v6n6r6v1v6n6r6v.apps.googleusercontent.com",
        callback: async (response) => {
            const { data, error } = await supabase.auth.signInWithIdToken({
                provider: 'google',
                token: response.credential
            });
            
            if (error) {
                console.error("Ошибка входа:", error);
                alert("Ошибка входа через Google: " + error.message);
                return;
            }
            
            if (data.session) {
                await initUserSession(data.session);
            }
        }
    });
    
    window.google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        { 
            theme: "filled_blue", 
            size: "large",
            text: "signin_with",
            shape: "rectangular",
            width: 250
        }
    );
}

// --- СЛУШАЕМ ИЗМЕНЕНИЯ БАЗЫ В РЕАЛЬНОМ ВРЕМЕНИ ---
supabase.channel('db-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
        if (currentUser) loadLeaderboard();
    })
    .subscribe();

// --- ПРИВЯЗКА ОБРАБОТЧИКОВ КНОПОК ---
document.getElementById('statusOnline').onclick = () => changeStatus('online');
document.getElementById('statusBreak').onclick = () => changeStatus('break');
document.getElementById('statusBusy').onclick = () => changeStatus('busy');
document.getElementById('statusOffline').onclick = () => changeStatus('offline');
document.getElementById('logoutBtn').onclick = logout;

// --- СТАРТ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ ---
window.addEventListener("DOMContentLoaded", async () => {
    await loadLeaderboard();
    setupGoogleLogin();
    
    // Проверяем, есть ли уже активная сессия
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
        await initUserSession(session);
    }
});
</script>
</body>
</html>
