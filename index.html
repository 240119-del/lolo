<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Monitor Pro</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0d0e12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .layout { flex-direction: column; }
        }
        .sidebar, .main-content {
            background: #12131a;
            border: 1px solid #1f222e;
            padding: 25px;
            border-radius: 16px;
        }
        .sidebar { flex: 1; min-width: 280px; }
        .main-content { flex: 2; }
        
        .status-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            background: #12131a;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #1f222e;
            box-sizing: border-box;
        }
        .online-count { color: #10b981; }
        .study-timer { color: #8b5cf6; }

        .btn {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-google { background: #db4437; }
        .btn-break { background: #ef4444; }
        .btn-success { background: #10b981; }

        /* Таблица Лидерборда */
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1f222e;
        }
        .leaderboard-item:last-child { border: none; }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-online { background: #10b981; }
        .status-break { background: #f59e0b; }
        .status-offline { background: #6b7280; }
    </style>
</head>
<body>

<div class="status-bar">
    <span class="online-count">● В сети: <span id="onlineNum">0</span></span>
    <span class="study-timer">Таймер: <span id="timerVal">0</span> сек.</span>
</div>

<div class="layout">
    <div class="sidebar">
        <h3 style="margin-top: 0; color: #a78bfa;">ТОП СТУДЕНТОВ</h3>
        <div id="leaderboard">Загрузка рейтинга...</div>
    </div>

    <div class="main-content">
        <button id="googleLoginBtn" class="btn btn-google">Войти через Google</button>
        
        <div id="controls" style="display: none; margin-top: 20px;">
            <p id="welcomeMsg" style="font-size: 18px; font-weight: bold;"></p>
            <button id="statusBtn" class="btn btn-break">Перерыв</button>
        </div>
    </div>
</div>

<script type="module">
// 🔥 НАСТРОЙКИ SUPABASE (Замени на свои!)
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
const SUPABASE_URL = "https://ghlijinxmngywoyxtgzs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdobGlqaW54bW5neXdveXh0Z3pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3ODQ0OTIsImV4cCI6MjA5MTM2MDQ5Mn0.cocCcMcygzKHqeHx9QaFsdaahUcS8mTKXGq9qBiUH6k";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let totalSeconds = 0;
let isBreak = false;
let currentUser = null;

// --- ТРЕКИНГ ПРИСУТСТВИЯ (REALTIME) ---
async function trackPresence(user) {
    const channel = supabase.channel('online-users');
    
    channel
        .on('presence', { event: 'sync' }, () => {
            const state = channel.presenceState();
            document.getElementById('onlineNum').innerText = Object.keys(state).length;
        })
        .subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
                await channel.track({ user: user.email, online_at: new Date() });
            }
        });
}

// --- ЛОГИКА ТАЙМЕРА ---
setInterval(async () => {
    if (currentUser && !isBreak) {
        totalSeconds++;
        document.getElementById('timerVal').innerText = totalSeconds;
        
        // Каждые 10 секунд сохраняем прогресс в базу данных
        if (totalSeconds % 10 === 0) {
            await supabase.from('profiles').upsert({ 
                id: currentUser.id, 
                full_name: currentUser.user_metadata.full_name || currentUser.email,
                total_study_time: totalSeconds,
                current_status: 'online'
            });
        }
    }
}, 1000);

// --- ОБНОВЛЕНИЕ СТАТУСА (ПЕРЕРЫВ / ПРОДОЛЖИТЬ) ---
document.getElementById('statusBtn').onclick = async () => {
    isBreak = !isBreak;
    const btn = document.getElementById('statusBtn');
    const newStatus = isBreak ? 'break' : 'online';
    
    if (isBreak) {
        btn.innerText = "Продолжить усердно учиться";
        btn.className = "btn btn-success";
    } else {
        btn.innerText = "Перерыв";
        btn.className = "btn btn-break";
    }

    if (currentUser) {
        await supabase.from('profiles').update({ current_status: newStatus }).eq('id', currentUser.id);
    }
};

// --- ПОЛУЧЕНИЕ И ОБНОВЛЕНИЕ ЛИДЕРБОРДА ---
async function loadLeaderboard() {
    const { data } = await supabase
        .from('profiles')
        .select('*')
        .order('total_study_time', { ascending: false });

    if (data) {
        const board = document.getElementById('leaderboard');
        board.innerHTML = "";
        data.forEach(student => {
            let statusClass = 'status-offline';
            if (student.current_status === 'online') statusClass = 'status-online';
            if (student.current_status === 'break') statusClass = 'status-break';

            board.innerHTML += `
                <div class="leaderboard-item">
                    <span>
                        <span class="status-dot ${statusClass}"></span>
                        ${student.full_name || 'Студент'}
                    </span>
                    <b style="color: #a78bfa;">${student.total_study_time} с</b>
                </div>
            `;
        });
    }
}

// РЕАЛТАЙМ ПОДПИСКА НА ИЗМЕНЕНИЯ РЕЙТИНГА
supabase
    .channel('schema-db-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
        loadLeaderboard();
    })
    .subscribe();

// --- АВТОРИЗАЦИЯ GOOGLE ---
async function loginWithGoogle() {
    await supabase.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + window.location.pathname }
    });
}

window.addEventListener("DOMContentLoaded", async () => {
    loadLeaderboard();
    
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
        currentUser = session.user;
        document.getElementById('googleLoginBtn').style.display = 'none';
        document.getElementById('controls').style.display = 'block';
        document.getElementById('welcomeMsg').innerText = `Привет, ${currentUser.user_metadata.full_name || 'Студент'}!`;
        
        trackPresence(currentUser);

        // Получаем сохраненное время студента из базы
        const { data } = await supabase.from('profiles').select('total_study_time').eq('id', currentUser.id).single();
        if (data) {
            totalSeconds = data.total_study_time;
            document.getElementById('timerVal').innerText = totalSeconds;
        }
    }

    document.getElementById("googleLoginBtn").addEventListener("click", loginWithGoogle);
});
</script>
</body>
</html>
